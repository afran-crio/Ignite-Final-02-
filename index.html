    <script>
      /* Measure the scrollbar width before first paint so the fluid grid can
         subtract it. The whole layout is derived from vw units, which include
         the scrollbar; without this the grid overflows by ~15px on desktop. */
      (function () {
        var sbw = window.innerWidth - document.documentElement.clientWidth;
        document.documentElement.style.setProperty('--sbw', sbw + 'px');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
